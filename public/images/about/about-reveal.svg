<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <pattern id="paper-grain" width="96" height="96" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="13" r="1" fill="#534d42" opacity=".08" />
      <circle cx="61" cy="48" r="1" fill="#534d42" opacity=".06" />
      <circle cx="34" cy="84" r="1" fill="#534d42" opacity=".05" />
      <path d="M12 66h12M75 9h8M79 78h6" stroke="#534d42" stroke-width="1" opacity=".04" />
    </pattern>
    <linearGradient id="warm-paper" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf2" />
      <stop offset="1" stop-color="#f5efe5" />
    </linearGradient>
  </defs>

  <path fill="url(#warm-paper)" d="M0 0h1920v1080H0z" />
  <path fill="url(#paper-grain)" d="M0 0h1920v1080H0z" />

  <g font-family="Arial, sans-serif" font-size="20" letter-spacing="5" fill="#6a665e">
    <text x="144" y="142">01</text>
    <path d="M190 135h64" stroke="#bcb7ae" />
    <text x="276" y="142">ABOUT KAAY KREAT</text>
  </g>

  <g fill="#121212" font-family="Georgia, 'Times New Roman', serif" letter-spacing="-5">
    <text x="144" y="425" font-size="104">Hey, we’re</text>
    <text x="140" y="566" font-size="148">Kaay Kreat<tspan fill="#ed5727">.</tspan></text>
  </g>
  <text x="150" y="638" fill="#68655f" font-family="Arial, sans-serif" font-size="24" letter-spacing="2">
    WE MAKE COOL STUFF, WITH A LITTLE MORE MEANING.
  </text>

  <g fill="#282725" font-family="Arial, sans-serif" font-size="35" letter-spacing="-1.1">
    <text x="1015" y="325">
      <tspan x="1015" dy="0">We believe great ideas deserve</tspan>
      <tspan x="1015" dy="49">to become something real.</tspan>
    </text>
    <text x="1015" y="485">
      <tspan x="1015" dy="0">We bring together creativity,</tspan>
      <tspan x="1015" dy="49">technology and curiosity to make</tspan>
      <tspan x="1015" dy="49">people stop and look.</tspan>
    </text>
    <text x="1015" y="695">
      <tspan x="1015" dy="0">We turn the unusual into</tspan>
      <tspan x="1015" dy="49">something unforgettable.</tspan>
    </text>
  </g>
  <text x="1015" y="834" fill="#ed5727" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic">
    And honestly, we’re just getting started.
  </text>

  <path d="M144 946h1632" stroke="#121212" stroke-opacity=".16" />
  <g fill="#6a665e" font-family="Arial, sans-serif" font-size="16" letter-spacing="4">
    <text x="144" y="986">INDEPENDENT CREATIVE TECHNOLOGY STUDIO</text>
    <text x="1520" y="986">KEEP SCROLLING</text>
  </g>
  <path d="M1718 976v18m0 0 8-8m-8 8-8-8" stroke="#ed5727" stroke-width="2" />
</svg>
